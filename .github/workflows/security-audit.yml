name: Security audit

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    # 毎週月曜 09:00 JST に、新しく公開された脆弱性がないか確認する
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json だけを見て判定するので npm ci は不要
      - name: Fail on critical vulnerabilities
        run: npm audit --audit-level=critical
